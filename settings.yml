# SearXNG settings.yml (minimal Auto Reranker additions).
# This snippet shows ONLY the fields that must be merged into your existing
# settings.yml. Keep the rest of your settings (engines, server, redis, ...)
# unchanged and only add/merge the two blocks below.
#
# IMPORTANT: in SearXNG >= 2024 the `plugins:` value is a DICT, not a list:
#     plugins:
#       fully.qualified.PluginClass:
#         active: true

use_default_settings: true

# Register plugins by fully-qualified class name. If you already have other
# plugins enabled, merge them into this dict — do NOT use a list.
plugins:
  searx.plugins.auto_reranker.plugin.AutoRerankerPlugin:
    active: true

# Configure the Auto Reranker plugin. All keys live under `auto_reranker:`.
auto_reranker:
  # PostgreSQL connection (same DB as config-ui).
  database_url: postgresql://auto_reranker:auto_reranker@postgres:5432/auto_reranker

  # TTL of the in-memory config cache (seconds). Lower = fresher, more DB load.
  cache_ttl: 30

  # Optional vector / reranker channel.
  vector_enabled: false
  vector_base_url: ""            # e.g. http://localhost:8000 or https://api.cohere.ai
  vector_api_key: ""             # set if your service requires a bearer token
  vector_protocol: "generic"     # generic | jina | cohere
  vector_top_n: 20
  vector_timeout: 0.5            # seconds; on timeout we silently fall back
