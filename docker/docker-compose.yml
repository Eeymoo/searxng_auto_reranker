version: "3.9"

# By default this compose starts ONLY PostgreSQL + config-ui, because most
# users already have their own SearXNG container and just want to overlay the
# plugin. If you want this compose to also bring up a fresh SearXNG instance,
# run:   docker compose --profile full up -d
#
# See docs/OVERLAY_DEPLOY.md for the full "I already have SearXNG" walkthrough.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auto_reranker
      POSTGRES_PASSWORD: auto_reranker
      POSTGRES_DB: auto_reranker
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_reranker"]
      interval: 5s
      timeout: 3s
      retries: 10

  config-ui:
    build:
      context: ../config-ui
      dockerfile: ../docker/config-ui.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://auto_reranker:auto_reranker@postgres:5432/auto_reranker
      # REQUIRED: override on deploy. Generate with `openssl rand -hex 32`.
      AUTORERANKER_TOKEN: change-me-to-a-long-random-secret
    ports:
      - "3000:3000"

  # ------------------------------------------------------------------ #
  # OPTIONAL bundled SearXNG. Disabled unless you pass --profile full.
  # Use this only if you want a fresh SearXNG instead of overlaying the
  # plugin onto an existing instance.
  # ------------------------------------------------------------------ #
  searxng:
    profiles: ["full"]
    image: searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://auto_reranker:auto_reranker@postgres:5432/auto_reranker
      AUTORERANKER_DATABASE_URL: postgresql://auto_reranker:auto_reranker@postgres:5432/auto_reranker
      SEARXNG_BASE_URL: http://localhost:8080/
    volumes:
      - ../searx/plugins/auto_reranker:/usr/local/searxng/searx/plugins/auto_reranker:ro
      - ./settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8080:8080"

volumes:
  pg_data:
